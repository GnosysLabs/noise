# Private compatibility ingress for the independently operated secondary relay.
# Tailscale encrypts transport; the application also requires its independent
# bearer token. This listener is not reachable from the public internet.
server {
    listen 100.99.59.98:4303;
    server_name _;
    access_log off;

    allow 100.110.203.27;
    deny all;

    location /internal/compat/ {
        proxy_pass http://127.0.0.1:4302/internal/compat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        return 404;
    }
}
